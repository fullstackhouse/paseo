# FSH fork: on every push to `fsh`, build an unsigned (ad-hoc signed) macOS arm64 DMG of the `fsh`
# branch and attach it to a GitHub Release on fullstackhouse/paseo.
#
# No latest-mac.yml is published: an ad-hoc signed app can't run electron-updater. The build
# stamps `fshBuild` (the release tag minus `fsh-`) into the app's package.json, and the app
# updates itself by running scripts/install-fsh.sh instead
# (packages/desktop/src/features/fsh-updater.ts).
#
# hardenedRuntime must be off. Upstream enables it (packages/desktop/electron-builder.yml)
# because upstream signs with a real Developer ID, so every nested binary shares one Team
# ID and library validation passes. Ad-hoc signatures carry no Team ID, so on macOS 26 the
# main binary is refused its own Electron Framework ("different Team IDs") and the app dies
# at launch in dyld. The runner below is macOS 14, which does not enforce this, so the
# packaged-app smoke test cannot catch it — keep the flag rather than relying on the gate.
#
# Only `fsh` publishes a release: install-fsh.sh installs GitHub's "latest" release, so a release
# from any other ref would reach every install. PRs that touch this workflow, and manual runs on
# other branches, upload the DMG as a run artifact instead.
name: FSH desktop build

on:
  push:
    branches: [fsh]
    paths-ignore: [FSH.md, README.md, "docs/fsh/**"]
  pull_request:
    paths: [.github/workflows/fsh-desktop.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    env:
      FSH_PUBLISH: ${{ github.ref == 'refs/heads/fsh' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the PR branch itself, not GitHub's merge commit, so the stamped sha is one you can find.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci

      # The macOS About panel shows CFBundleVersion in brackets, then Credits.html, then the
      # copyright. Upstream's defaults make every FSH build look the same, so stamp the commit,
      # the build time and links to the release and commit.
      - name: Stamp FSH build info
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packages/desktop/package.json").version')"
          sha="$(git rev-parse --short HEAD)"
          tag="fsh-${version}-${sha}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$FSH_PUBLISH" == "true" ]]; then
            build_link="<a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}\">Release ${tag}</a>"
          else
            build_link="<a href=\"${run_url}\">Test build (run ${GITHUB_RUN_ID})</a>"
          fi
          echo "FSH_SHA=${sha}" >> "$GITHUB_ENV"
          echo "FSH_VERSION=${version}" >> "$GITHUB_ENV"
          echo "FSH_TAG=${tag}" >> "$GITHUB_ENV"
          cat > packages/desktop/Credits.html <<EOF
          <div style="font: 11px -apple-system, sans-serif; text-align: center">
          Built $(date -u '+%Y-%m-%d %H:%M UTC')<br>
          ${build_link} ·
          <a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/$(git rev-parse HEAD)">Commit ${sha}</a>
          </div>
          EOF
          # Append to upstream's mac.extraResources: a -c.mac.extraResources override replaces the list
          # and drops the bundled CLI shim.
          node -e '
            const fs = require("fs");
            const yaml = require(require.resolve("js-yaml", { paths: [require.resolve("app-builder-lib")] }));
            const file = "packages/desktop/electron-builder.yml";
            const config = yaml.load(fs.readFileSync(file, "utf8"));
            config.mac.extraResources.push({ from: "Credits.html", to: "Credits.html" });
            fs.writeFileSync(file, yaml.dump(config, { lineWidth: -1 }));
          '

      - name: Build desktop app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Upstream's packaged-app smoke test (scripts/after-sign.js) gates the release.
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run build:desktop -- --publish never --mac dmg --arm64 \
            "-c.extraMetadata.fshBuild=${FSH_VERSION}-${FSH_SHA}" \
            -c.mac.identity=- \
            -c.mac.notarize=false \
            -c.mac.hardenedRuntime=false \
            -c.publish.owner=fullstackhouse \
            -c.buildVersion="fsh.${FSH_SHA}" \
            -c.copyright="Copyright © $(date +%Y) Mohamed Boudra · FSH build by Full Stack House"

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test DMG
        if: env.FSH_PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paseo-fsh-${{ env.FSH_SHA }}-dmg
          path: packages/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: env.FSH_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$FSH_VERSION"
          tag="$FSH_TAG"
          gh release create "$tag" packages/desktop/release/*.dmg \
            --target "$GITHUB_SHA" \
            --title "Paseo ${version} (FSH ${GITHUB_SHA::7})" \
            --notes "Upstream Paseo ${version} plus the FSH patches on \`fsh\` ($(git log -1 --format=%h)). Unsigned: after copying to Applications, run \`xattr -cr /Applications/Paseo.app\` once."
