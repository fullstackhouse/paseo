# FSH fork: our own Android app, sideloaded, built here instead of on Expo's build service.
#
# - Pull requests into `fsh`: build the APK and keep it as a workflow artifact (a gate).
# - Pushes to `fsh`: build and publish it on a GitHub Release (`fsh-android-*`).
#
# Variant `fsh` (packages/app/app.config.js): package `house.fullstack.paseo`, so it installs next
# to the store app. Push notifications go through our own Expo project and Firebase
# (fsh-monorepo infra/paseo-push); the Firebase config comes from the Actions variable
# FSH_GOOGLE_SERVICES_JSON. The version code is 1_000_000 + this workflow's run number, so it
# grows with every build and stays above the earlier F-Droid-style builds (~130000).
#
# Google Play: every build also makes an AAB (artifact paseo-fsh-aab); with the Actions variable
# PLAY_UPLOAD_ENABLED=true, pushes to `fsh` upload it to the internal testing track.
#
# Signed with FSH's own key (plugins/with-fsh-release-signing.js), backed up in GCP Secret
# Manager as paseo-android-keystore{,-password}. Android only installs an update signed with the
# same key, so losing it means every phone uninstalls and reinstalls.
name: FSH Android build

on:
  push:
    branches: [fsh]
    paths-ignore: [FSH.md, README.md, "docs/fsh/**"]
  pull_request:
    branches: [fsh]
    paths:
      - packages/app/**
      - packages/client/**
      - packages/protocol/**
      - packages/plugin/**
      - package-lock.json
      - .github/workflows/fsh-android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fsh-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/app/app.config.js') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Prebuild Android
        working-directory: packages/app
        env:
          APP_VARIANT: fsh
          GOOGLE_SERVICES_JSON: ${{ vars.FSH_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Actions variable FSH_GOOGLE_SERVICES_JSON is not set"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          export GOOGLE_SERVICES_FILE_FSH="$RUNNER_TEMP/google-services.json"
          export FSH_ANDROID_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))
          echo "FSH_ANDROID_VERSION_CODE=$FSH_ANDROID_VERSION_CODE" >> "$GITHUB_ENV"
          npx expo prebuild --platform android --no-install

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PASEO_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::PASEO_ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fsh-paseo.p12"
          echo "PASEO_ANDROID_KEYSTORE=$RUNNER_TEMP/fsh-paseo.p12" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: packages/app/android
        env:
          APP_VARIANT: fsh
          PASEO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PASEO_ANDROID_KEYSTORE_PASSWORD }}
          PASEO_ANDROID_KEY_PASSWORD: ${{ secrets.PASEO_ANDROID_KEYSTORE_PASSWORD }}
          PASEO_ANDROID_KEY_ALIAS: fsh-paseo
        # arm64 only: every phone we use is 64-bit ARM, and one ABI halves the build.
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --max-workers=4 \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify signature
        run: |
          set -euo pipefail
          apk=packages/app/android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          # Refuse to ship anything signed with the template's shared debug key.
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK is signed with the debug key"
            exit 1
          fi
          version="$(node -p 'require("./packages/app/package.json").version')"
          echo "APK_VERSION=$version" >> "$GITHUB_ENV"
          echo "APK_PATH=$RUNNER_TEMP/paseo-fsh-${version}-${GITHUB_SHA::7}-arm64.apk" >> "$GITHUB_ENV"
          cp "$apk" "$RUNNER_TEMP/paseo-fsh-${version}-${GITHUB_SHA::7}-arm64.apk"

      - name: Upload artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: paseo-fsh-apk
          path: ${{ env.APK_PATH }}
          retention-days: 7

      # The Google Play bundle, signed with the same FSH key (Play App Signing was set up to sign
      # with this key too, so Play installs and the GitHub APK update each other).
      - name: Verify and keep the Play bundle
        run: |
          set -euo pipefail
          aab=packages/app/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab"
          keytool -printcert -jarfile "$aab" | tee "$RUNNER_TEMP/aab-certs.txt"
          if ! grep -q "CN=Full Stack House" "$RUNNER_TEMP/aab-certs.txt"; then
            echo "::error::Play bundle is not signed with the FSH key"
            exit 1
          fi
          echo "AAB_PATH=$aab" >> "$GITHUB_ENV"

      - name: Upload Play bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: paseo-fsh-aab
          path: ${{ env.AAB_PATH }}
          retention-days: 14

      # Off until Play Console has the app's first release and the play-publisher service account
      # (fsh-monorepo infra/paseo-push) is invited: set the Actions variable PLAY_UPLOAD_ENABLED=true.
      - name: Upload to Google Play (internal testing)
        if: github.event_name != 'pull_request' && vars.PLAY_UPLOAD_ENABLED == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: house.fullstack.paseo
          releaseFiles: ${{ env.AAB_PATH }}
          track: internal
          status: completed

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="fsh-android-${APK_VERSION}-${GITHUB_SHA::7}"
          gh release create "$tag" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "Paseo Android ${APK_VERSION} (FSH ${GITHUB_SHA::7})" \
            --notes "Android APK of \`fsh\` ($(git log -1 --format=%h)), package \`house.fullstack.paseo\`, signed with the FSH key. Version code ${FSH_ANDROID_VERSION_CODE}. Install by hand or track with Obtainium."

      # A link that never changes, for phones: always the newest APK under one name.
      #   https://github.com/fullstackhouse/paseo/releases/download/fsh-android-latest/paseo-fsh-arm64.apk
      # A separate release, because GitHub's own "latest" stays on the desktop DMG.
      - name: Update stable download link
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          stable="$RUNNER_TEMP/paseo-fsh-arm64.apk"
          cp "$APK_PATH" "$stable"
          notes="Always the newest Android build of \`fsh\`. Now: ${APK_VERSION}, commit ${GITHUB_SHA::7}. Install link: https://github.com/${GITHUB_REPOSITORY}/releases/download/fsh-android-latest/paseo-fsh-arm64.apk"
          if gh release view fsh-android-latest >/dev/null 2>&1; then
            gh release upload fsh-android-latest "$stable" --clobber
            gh release edit fsh-android-latest --notes "$notes"
          else
            gh release create fsh-android-latest "$stable" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --title "Paseo Android (FSH, newest build)" \
              --notes "$notes"
          fi
